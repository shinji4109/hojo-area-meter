<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#174a3b">
  <meta name="description" content="航空写真をタップして圃場の面積を計測。GPS現在地・保存・書き出しに対応。">
  <link rel="manifest" href="manifest.webmanifest">
  <title>圃場面積メジャー</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#19352a;background:#eef3ef;--green:#17644e;--dark:#174a3b;--border:#dbe6dd}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    button,input{font:inherit}
    button{cursor:pointer;touch-action:manipulation}
    button:focus-visible,input:focus-visible{outline:3px solid #e7b850;outline-offset:2px}
    .app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(270px,1fr) auto}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--dark);color:white;padding:10px 14px;min-height:57px}
    .brand{font-size:1.1rem;font-weight:800;letter-spacing:.02em;line-height:1.25}
    .subbrand{font-size:.72rem;color:#d5e7dc;font-weight:400;margin-top:2px}
    .gpsstate{font-size:.72rem;color:#edfaef;border:1px solid #7ca698;border-radius:20px;padding:6px 9px;white-space:nowrap;max-width:48vw;overflow:hidden;text-overflow:ellipsis}
    .mapwrap{position:relative;min-width:0;min-height:0;background:#dae3df}
    #map{position:absolute;inset:0}
    .maptools{position:absolute;z-index:500;top:10px;right:10px;display:flex;border-radius:11px;overflow:hidden;box-shadow:0 2px 9px #152e2442}
    .maptools button{border:0;padding:10px 12px;background:white;color:#203c30;font-weight:700;font-size:.85rem}
    .maptools button.active{background:var(--green);color:white}
    .maphint{position:absolute;z-index:450;left:10px;top:10px;max-width:55%;background:#fffef0e8;color:#355441;border:1px solid #e5e4c2;padding:8px 10px;border-radius:10px;font-size:.75rem;line-height:1.45;pointer-events:none}
    .leaflet-control-zoom{border:0!important;box-shadow:0 2px 8px #0002!important}
    .leaflet-control-attribution{font-size:10px!important;background:#fffd!important}
    .vertex-marker{width:25px;height:25px;background:#ffc348;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;color:#3e321c;font-size:11px;font-weight:800;box-shadow:0 1px 5px #0009;touch-action:none}
    .panel{min-height:0;overflow:auto;background:#fff;padding:12px 12px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -2px 11px #0a2e2518}
    .area-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
    .eyebrow{font-weight:800;font-size:.78rem;color:#546d5e}
    .area-value{font-size:2rem;line-height:1.25;font-weight:800;letter-spacing:-.03em;color:var(--dark);font-variant-numeric:tabular-nums}
    .area-value small{font-size:.94rem;letter-spacing:0}
    .conversion{font-size:.82rem;color:#546459;font-variant-numeric:tabular-nums;margin:3px 0 10px;line-height:1.4}
    .count{color:#55705e;font-weight:700;font-size:.75rem;border-radius:20px;background:#eaf3ed;padding:6px 10px;white-space:nowrap}
    .toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .btn{background:#f4f7f4;color:#1a4937;border:1px solid var(--border);border-radius:12px;min-height:45px;padding:9px 7px;font-size:.9rem;font-weight:750;line-height:1.3}
    .btn:active{transform:translateY(1px)}
    .btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
    .btn-accent{background:#edf7ee;color:#1d5d36;border-color:#b9dbc4}
    .btn-danger{background:#fff7f3;color:#9b3d2a;border-color:#f1d5cb}
    .btn:disabled{opacity:.47;cursor:not-allowed}
    .status{font-size:.78rem;color:#506557;line-height:1.5;margin:8px 0 10px;min-height:18px}
    .status.warn{color:#a34b27}
    .divider{height:1px;background:#e8eee9;margin:10px 0}
    details>summary{font-size:.9rem;font-weight:800;cursor:pointer;padding:2px 0 8px;user-select:none}
    .savedlist{display:grid;gap:8px}
    .saveditem{display:flex;align-items:center;gap:6px;padding:9px;background:#f4f7f4;border:1px solid #e0e9e2;border-radius:10px}
    .savedtext{flex:1;min-width:0}
    .savedname{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.84rem;font-weight:800}
    .savedmeta{font-size:.73rem;color:#587061;margin-top:2px}
    .minibtn{padding:7px 9px;border:1px solid #d0dfd4;border-radius:9px;background:#fff;color:#235c42;font-size:.76rem;font-weight:800;white-space:nowrap}
    .minibtn.del{color:#a34232}
    .exports{display:flex;gap:7px;margin-top:10px}
    .exports button{flex:1}
    .smallnote{font-size:.72rem;color:#607066;line-height:1.5;margin-top:12px}
    .empty{color:#75887a;font-size:.83rem;padding:10px 0}
    @media(min-width:850px){
      .app{grid-template-columns:minmax(0,1fr) 375px;grid-template-rows:61px minmax(0,1fr)}
      .topbar{grid-column:1 / -1;padding:12px 22px}
      .mapwrap{grid-column:1;grid-row:2}
      .panel{grid-column:2;grid-row:2;padding:24px 20px;box-shadow:-2px 0 12px #0a2e2518}
      .area-value{font-size:2.5rem}
    }
    @media(max-height:700px) and (max-width:849px){
      .app{grid-template-rows:auto minmax(220px,52dvh) minmax(0,1fr)}
      .panel{padding-top:8px}
      .area-value{font-size:1.65rem}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div><div class="brand">🌱 圃場面積メジャー</div><div class="subbrand">タップで囲んで、面積を測る</div></div>
    <div id="gpsState" class="gpsstate" role="status">GPS：未取得</div>
  </header>
  <main class="mapwrap">
    <div id="map" aria-label="地図上で圃場の境界を選択"></div>
    <div class="maphint" id="mapHint">地図を3点以上タップして、測りたい範囲を囲んでください。</div>
    <div class="maptools" aria-label="背景地図を切り替え">
      <button id="streetBtn" class="active" type="button" aria-pressed="true">地図</button>
      <button id="photoBtn" type="button" aria-pressed="false">航空写真</button>
    </div>
  </main>
  <aside class="panel">
    <div class="area-top"><div class="eyebrow">選択範囲の面積</div><div id="pointCount" class="count">0地点</div></div>
    <div class="area-value"><span id="areaMain">—</span> <small>m²</small></div>
    <div id="conversion" class="conversion">3点以上で面積を表示します</div>
    <div class="toolbar">
      <button class="btn btn-primary" id="gpsBtn" type="button">⌖ 現在地を表示</button>
      <button class="btn btn-accent" id="addGpsBtn" type="button" disabled>＋ GPS地点を追加</button>
      <button class="btn" id="undoBtn" type="button" disabled>↶ 1点戻す</button>
      <button class="btn btn-danger" id="clearBtn" type="button" disabled>✕ 描画をクリア</button>
      <button class="btn btn-primary" id="saveBtn" type="button" disabled>▣ この圃場を保存</button>
      <button class="btn" id="fitBtn" type="button" disabled>▢ 範囲を全表示</button>
    </div>
    <div id="message" class="status" aria-live="polite">角の丸いマーカーはドラッグして位置を調整できます。</div>
    <div class="divider"></div>
    <details id="savedDetails" open>
      <summary>保存した圃場 <span id="savedCount">(0)</span></summary>
      <div id="savedList" class="savedlist"><div class="empty">まだ保存されていません。</div></div>
    </details>
    <div class="exports">
      <button id="csvBtn" type="button" class="minibtn">CSV出力</button>
      <button id="geoBtn" type="button" class="minibtn">GeoJSON出力</button>
    </div>
    <p class="smallnote">※ 面積は地球を球体とみなした概算値です。GPSや航空写真の位置には誤差があります。補助金申請・登記・境界確定等の正式測量には使用しないでください。地図の閲覧には通信が必要です。</p>
  </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const STORAGE_KEY = 'hojo_area_meter_fields_v1';
  const RAD = Math.PI / 180;
  const EARTH_RADIUS = 6378137;
  const TSUBO_M2 = 400 / 121;
  const TAN_M2 = TSUBO_M2 * 300;
  let points = [];
  let markers = [];
  let fields = readFields();
  let activeId = null;
  let gpsPos = null;
  let gpsWatchId = null;
  let gpsMarker = null;
  let gpsAccuracyCircle = null;
  let hasCenteredFromGps = false;
  let photoLayer;
  let streetLayer;
  let currentLayer;
  let polygon;
  let polyline;

  function readFields() {
    try {
      const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(value) ? value.filter(f => f && typeof f.name === 'string' && Array.isArray(f.points)) : [];
    } catch { return []; }
  }
  function persistFields() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fields)); return true; }
    catch { setMessage('保存領域を利用できません。ブラウザの設定を確認してください。', true); return false; }
  }
  function setMessage(message, warn=false) {
    $('message').textContent = message;
    $('message').className = warn ? 'status warn' : 'status';
  }
  function fixed(value, digits=2) {
    return Number(value).toLocaleString('ja-JP', {maximumFractionDigits: digits, minimumFractionDigits: digits});
  }
  // Spherical polygon area, valid for small-to-medium farmland polygons.
  function computeArea(vertices) {
    if (vertices.length < 3) return 0;
    let total = 0;
    for (let i = 0; i < vertices.length; i++) {
      const a = vertices[i], b = vertices[(i + 1) % vertices.length];
      let delta = (b.lng - a.lng) * RAD;
      if (delta > Math.PI) delta -= 2 * Math.PI;
      if (delta < -Math.PI) delta += 2 * Math.PI;
      total += delta * (2 + Math.sin(a.lat * RAD) + Math.sin(b.lat * RAD));
    }
    return Math.abs(total * EARTH_RADIUS * EARTH_RADIUS / 2);
  }
  function segmentsIntersect(a,b,c,d) {
    const avgLat = (a.lat + b.lat + c.lat + d.lat) / 4 * RAD;
    const point = p => ({x:p.lng * Math.cos(avgLat), y:p.lat});
    const A=point(a), B=point(b), C=point(c), D=point(d);
    const orientation = (p,q,r) => (q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
    const o1=orientation(A,B,C), o2=orientation(A,B,D), o3=orientation(C,D,A), o4=orientation(C,D,B);
    return ((o1 > 1e-13 && o2 < -1e-13) || (o1 < -1e-13 && o2 > 1e-13)) &&
           ((o3 > 1e-13 && o4 < -1e-13) || (o3 < -1e-13 && o4 > 1e-13));
  }
  function hasSelfIntersection(vertices) {
    const n = vertices.length;
    if (n < 4) return false;
    for (let i=0;i<n;i++) {
      for (let j=i+1;j<n;j++) {
        if (j === i+1 || (i === 0 && j === n-1)) continue;
        if (segmentsIntersect(vertices[i],vertices[(i+1)%n],vertices[j],vertices[(j+1)%n])) return true;
      }
    }
    return false;
  }
  function validPolygon() {
    return points.length >= 3 && !hasSelfIntersection(points) && computeArea(points) > 0.01;
  }
  if (!window.L) {
    $('mapHint').textContent = '地図ライブラリを読み込めませんでした。ネット接続を確認して再読み込みしてください。';
    setMessage('ネット接続が必要です。', true);
    return;
  }
  const map = L.map('map', {zoomControl:false, preferCanvas:true, maxZoom:20}).setView([36.2, 138.25], 6);
  L.control.zoom({position:'bottomright'}).addTo(map);
  streetLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>',
    maxNativeZoom:18,maxZoom:20
  });
  photoLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
    attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">航空写真：国土地理院</a>',
    minZoom:14,maxNativeZoom:18,maxZoom:20
  });
  currentLayer = streetLayer.addTo(map);
  polygon = L.polygon([], {color:'#ffb62e',weight:3,fillColor:'#ffcb4b',fillOpacity:.25,interactive:false}).addTo(map);
  polyline = L.polyline([], {color:'#ffb62e',weight:3,dashArray:'7,6',interactive:false}).addTo(map);
  function setLayer(kind) {
    const usePhoto = kind === 'photo';
    map.removeLayer(currentLayer);
    currentLayer = usePhoto ? photoLayer : streetLayer;
    currentLayer.addTo(map);
    currentLayer.bringToBack();
    if (usePhoto && map.getZoom()<14) map.setZoom(15);
    $('photoBtn').classList.toggle('active', usePhoto);
    $('streetBtn').classList.toggle('active', !usePhoto);
    $('photoBtn').setAttribute('aria-pressed', String(usePhoto));
    $('streetBtn').setAttribute('aria-pressed', String(!usePhoto));
  }
  $('streetBtn').addEventListener('click', () => setLayer('street'));
  $('photoBtn').addEventListener('click', () => setLayer('photo'));
  map.on('click', e => addPoint({lat:e.latlng.lat, lng:e.latlng.lng}));
  function addPoint(point) {
    if (points.length >= 80) { setMessage('1つの圃場は80点まで登録できます。', true); return; }
    points.push({lat:+point.lat, lng:+point.lng});
    draw();
  }
  function draw() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    points.forEach((point, index) => {
      const markerIcon = L.divIcon({className:'',html:`<div class="vertex-marker">${index+1}</div>`,iconSize:[25,25],iconAnchor:[12,12]});
      const marker = L.marker([point.lat, point.lng], {icon:markerIcon,draggable:true,bubblingMouseEvents:false,autoPan:true}).addTo(map);
      marker.bindTooltip(`${index+1}番目の地点：ドラッグで移動`, {direction:'top'});
      marker.on('drag', () => {
        const loc=marker.getLatLng();
        points[index]={lat:loc.lat,lng:loc.lng};
        drawShape();
      });
      marker.on('dragend', () => draw());
      markers.push(marker);
    });
    drawShape();
  }
  function drawShape() {
    const coords = points.map(p => [p.lat,p.lng]);
    polygon.setLatLngs(points.length >= 3 ? coords : []);
    polyline.setLatLngs(points.length === 2 ? coords : []);
    const intersect = hasSelfIntersection(points);
    const area = validPolygon() ? computeArea(points) : null;
    $('pointCount').textContent = `${points.length}地点`;
    $('areaMain').textContent = area == null ? '—' : fixed(area,area<100?2:1);
    $('conversion').textContent = area == null ? (intersect ? '辺が交差しています。点を移動して修正してください。' : '3点以上で面積を表示します') :
      `${fixed(area/100)} a  ／  ${fixed(area/10000,4)} ha  ／  ${fixed(area/TAN_M2,3)} 反`;
    $('saveBtn').disabled = area == null;
    $('undoBtn').disabled = points.length === 0;
    $('clearBtn').disabled = points.length === 0;
    $('fitBtn').disabled = points.length === 0;
    $('mapHint').textContent = points.length===0 ? '地図を3点以上タップして、測りたい範囲を囲んでください。' :
      (intersect ? '線が交差しています。番号付きの点をドラッグして調整してください。' : 'さらに点を追加できます。番号付きの点はドラッグで調整できます。');
    polygon.setStyle({color:intersect?'#c74035':'#ffb62e',fillColor:intersect?'#de6551':'#ffcb4b'});
  }
  $('undoBtn').addEventListener('click', () => { if(points.length){points.pop();draw();} });
  $('clearBtn').addEventListener('click', () => {
    if (points.length && !confirm('今の描画を消去しますか？（保存済みの圃場は残ります）')) return;
    points=[];activeId=null;draw();setMessage('描画をクリアしました。');
  });
  $('fitBtn').addEventListener('click', () => {
    if (!points.length) return;
    if(points.length===1) map.setView([points[0].lat,points[0].lng],18);
    else map.fitBounds(L.latLngBounds(points.map(p => [p.lat,p.lng])), {padding:[35,35],maxZoom:19});
  });
  function gpsError(error) {
    const reason = error && error.code===1 ? '位置情報の利用が許可されていません。Chromeの設定を確認してください。' :
      error && error.code===2 ? 'GPSの位置情報を取得できません。電波状態を確認してください。' :
      'GPSの取得がタイムアウトしました。屋外でもう一度お試しください。';
    $('gpsState').textContent='GPS：取得失敗';
    setMessage(`${reason} ※GPSは通常HTTPSで公開した画面から利用します。`, true);
    if(gpsWatchId != null) {navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}
  }
  function startGPS() {
    if (!navigator.geolocation || !window.isSecureContext) {
      setMessage('GPSはHTTPS公開ページまたはlocalhostで利用してください。ファイルを直接開くと動かない場合があります。', true);
      $('gpsState').textContent='GPS：HTTPSが必要';
      return;
    }
    if (gpsWatchId != null) {
      if(gpsPos) { map.setView([gpsPos.lat,gpsPos.lng],Math.max(map.getZoom(),17)); setMessage('現在地を地図の中央に表示しました。'); }
      return;
    }
    $('gpsState').textContent='GPS：取得中…';
    setMessage('GPSの測位を開始します。位置情報の利用を許可してください。');
    gpsWatchId = navigator.geolocation.watchPosition(position => {
      const {latitude, longitude, accuracy}=position.coords;
      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return;
      gpsPos={lat:latitude,lng:longitude,accuracy:accuracy,timestamp:position.timestamp};
      if(!gpsMarker) {
        gpsMarker=L.circleMarker([latitude,longitude], {radius:9,color:'#fff',weight:3,fillColor:'#2975e9',fillOpacity:1,interactive:false}).addTo(map);
        gpsAccuracyCircle=L.circle([latitude,longitude], {radius:accuracy||0,color:'#2975e9',weight:1,fillOpacity:.07,interactive:false}).addTo(map);
      } else {
        gpsMarker.setLatLng([latitude,longitude]);
        gpsAccuracyCircle.setLatLng([latitude,longitude]).setRadius(accuracy||0);
      }
      $('gpsState').textContent = Number.isFinite(accuracy)?`GPS：±${Math.round(accuracy)}m`:'GPS：取得済み';
      $('addGpsBtn').disabled=false;
      if(!hasCenteredFromGps) {
        hasCenteredFromGps=true;
        map.setView([latitude,longitude],18);
      }
    }, gpsError, {enableHighAccuracy:true,maximumAge:0,timeout:25000});
  }
  $('gpsBtn').addEventListener('click', () => {
    if (gpsPos) map.setView([gpsPos.lat,gpsPos.lng],18);
    else startGPS();
  });
  $('addGpsBtn').addEventListener('click', () => {
    if (!gpsPos) return;
    const age=Date.now()-gpsPos.timestamp;
    if(age>60000){setMessage('GPS位置情報が古くなっています。屋外で測位を確認してください。', true);return;}
    if(gpsPos.accuracy>15 && !confirm(`GPSの推定誤差は約±${Math.round(gpsPos.accuracy)}mです。境界点として追加しますか？`)) return;
    addPoint(gpsPos);
    setMessage(`現在地を${points.length}番目の頂点として追加しました。`);
  });
  function escapeHtml(s) {return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function renderSaved() {
    $('savedCount').textContent=`(${fields.length})`;
    const sorted=[...fields].sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));
    $('savedList').innerHTML = sorted.length ? sorted.map(f=>{
      const area=computeArea(f.points);
      return `<div class="saveditem"><div class="savedtext"><span class="savedname">${escapeHtml(f.name)}</span><div class="savedmeta">${fixed(area,1)} m² ・ ${fixed(area/100)} a</div></div><button class="minibtn" data-load="${escapeHtml(f.id)}">表示</button><button class="minibtn del" data-delete="${escapeHtml(f.id)}">削除</button></div>`;
    }).join('') : '<div class="empty">まだ保存されていません。</div>';
  }
  $('saveBtn').addEventListener('click', () => {
    if(!validPolygon()) {setMessage('3点以上の交差しない範囲を選んでください。',true);return;}
    const previous=fields.find(f=>f.id===activeId);
    const proposed=previous ? previous.name : `圃場 ${fields.length+1}`;
    const name=prompt('圃場の名前を入力してください',proposed);
    if(name==null) return;
    const clean=name.trim().slice(0,80);
    if(!clean){setMessage('圃場名を入力してください。',true);return;}
    const stamp=new Date().toISOString();
    const data={id:activeId || `field-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,name:clean,points:points.map(p=>({lat:p.lat,lng:p.lng})),updatedAt:stamp,createdAt:previous?.createdAt||stamp};
    fields=fields.filter(f=>f.id!==data.id);
    fields.push(data);
    if(persistFields()) {activeId=data.id;renderSaved();setMessage(`「${clean}」をこの端末に保存しました。`);}
  });
  $('savedList').addEventListener('click', e => {
    const btn=e.target.closest('button');
    if(!btn) return;
    const loadId=btn.getAttribute('data-load');
    const delId=btn.getAttribute('data-delete');
    if(loadId) {
      const field=fields.find(f=>f.id===loadId);
      if(!field)return;
      if(points.length && !confirm('現在の描画を置き換えて、保存済みの圃場を表示しますか？')) return;
      points=field.points.map(p=>({lat:+p.lat,lng:+p.lng}));
      activeId=field.id;
      draw();
      $('fitBtn').click();
      setMessage(`「${field.name}」を読み込みました。頂点の移動後に再保存できます。`);
    }
    if(delId) {
      const field=fields.find(f=>f.id===delId);
      if(!field || !confirm(`保存済みの「${field.name}」を削除しますか？`))return;
      fields=fields.filter(f=>f.id!==delId);
      if(activeId===delId)activeId=null;
      persistFields();renderSaved();setMessage('保存済みの圃場を削除しました。');
    }
  });
  function downloadText(filename,text,type) {
    const blob=new Blob([text],{type});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
  function getExportFields() {
    if(fields.length) return fields;
    if(validPolygon()) return [{id:'temporary',name:'未保存の圃場',points,updatedAt:new Date().toISOString()}];
    setMessage('先に範囲を指定して保存してください。',true);
    return [];
  }
  function safeCsvCell(s) {
    let value=String(s ?? '');
    if (/^[\s]*[=+@-]/.test(value)) value="'"+value;
    return '"'+value.replace(/"/g,'""')+'"';
  }
  $('csvBtn').addEventListener('click', () => {
    const list=getExportFields();if(!list.length)return;
    const header=['圃場名','面積m2','面積a','面積ha','面積反','更新日時','緯度経度'];
    const rows=list.map(f=>{
      const m2=computeArea(f.points);
      return [f.name,m2.toFixed(2),(m2/100).toFixed(4),(m2/10000).toFixed(6),(m2/TAN_M2).toFixed(5),f.updatedAt||'',f.points.map(p=>`${p.lat.toFixed(7)} ${p.lng.toFixed(7)}`).join('; ')].map(safeCsvCell).join(',');
    });
    downloadText('hojo_areas.csv','\ufeff'+[header.map(safeCsvCell).join(','),...rows].join('\r\n'),'text/csv;charset=utf-8');
    setMessage('CSVファイルを書き出しました。');
  });
  $('geoBtn').addEventListener('click', () => {
    const list=getExportFields();if(!list.length)return;
    const geojson={type:'FeatureCollection',features:list.map(f=>({type:'Feature',properties:{name:f.name,area_m2:+computeArea(f.points).toFixed(2),updated_at:f.updatedAt},geometry:{type:'Polygon',coordinates:[[...f.points.map(p=>[p.lng,p.lat]),[f.points[0].lng,f.points[0].lat]]]}}))};
    downloadText('hojo_areas.geojson',JSON.stringify(geojson,null,2),'application/geo+json;charset=utf-8');
    setMessage('GeoJSONファイルを書き出しました。');
  });
  renderSaved();
  draw();
  if('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
